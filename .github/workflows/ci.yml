name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-production:
    name: Windows production / Python 3.13
    runs-on: windows-latest
    env:
      DAILY_REPORT_PATHS__WORK_DIR: ${{ github.workspace }}/.ci-work
      DEEPSEEK_API_KEY: ci-doctor-placeholder
      AI_DAILY_TEST_FORBID_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Sync locked Python dependencies
        run: uv sync --frozen
      - name: Verify production requirements projection
        run: uv run pytest tests/test_requirements_lock.py -v
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Lint Rust workspace
        run: >-
          cargo clippy --manifest-path rust/Cargo.toml
          --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: >-
          cargo test --manifest-path rust/Cargo.toml
          --workspace --locked
      - name: Build Rust release workspace
        run: >-
          cargo build --manifest-path rust/Cargo.toml
          --workspace --release --locked
      - name: Prepare non-secret Windows configuration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.ci-work' -Force | Out-Null
          Copy-Item -LiteralPath 'config/settings.example.yaml' `
            -Destination 'config/settings.windows.yaml'
      - name: Install clean production environment from requirements.lock
        shell: pwsh
        run: |
          $prodVenv = Join-Path $env:RUNNER_TEMP 'ai-daily-production-venv'
          python -m venv $prodVenv
          if ($LASTEXITCODE -ne 0) { throw 'production venv creation failed' }
          $prodPython = Join-Path $prodVenv 'Scripts\python.exe'
          & $prodPython -m pip install --requirement requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'production lock install failed' }
          & $prodPython -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'production dependency check failed' }
          Add-Content -LiteralPath $env:GITHUB_ENV `
            -Value "AI_DAILY_PROD_PYTHON=$prodPython" -Encoding utf8
      - name: Verify production Python worker handshakes
        shell: pwsh
        run: |
          $workerJson = & $env:AI_DAILY_PROD_PYTHON `
            -m src.workers.document_parser_worker version
          if ($LASTEXITCODE -ne 0) { throw 'worker version handshake failed' }
          $sessionJson = & $env:AI_DAILY_PROD_PYTHON `
            -m src.workers.document_parser_worker session-version
          if ($LASTEXITCODE -ne 0) { throw 'session-version handshake failed' }
          $worker = $workerJson | ConvertFrom-Json
          $session = $sessionJson | ConvertFrom-Json
          if (
            $worker.contract -ne 'ai_daily_worker' -or
            [int]$worker.protocol_version -ne 1 -or
            $worker.worker_kind -ne 'python_document' -or
            $worker.worker_contract_version -ne 'ai_daily_worker_v1' -or
            $worker.worker_build -notmatch '^[0-9a-f]{64}$'
          ) {
            throw 'worker version identity mismatch'
          }
          if (
            $session.contract -ne 'ai_daily_python_session' -or
            [int]$session.protocol_version -ne 1 -or
            $session.session_contract_version -ne 'ai_daily_python_session_v1' -or
            $session.worker_build -ne $worker.worker_build -or
            $session.classifier_build -notmatch '^[0-9a-f]{64}$' -or
            (@($session.supported_operations) -join ',') -ne 'classify_pdf_v1,parse_v1'
          ) {
            throw 'session-version identity mismatch'
          }
      - name: Run strict production doctor in clean environment
        shell: pwsh
        run: |
          & $env:AI_DAILY_PROD_PYTHON main.py doctor --strict
          if ($LASTEXITCODE -ne 0) { throw 'clean production doctor failed' }
      - name: Run fixed corpus gate in clean environment
        shell: pwsh
        run: |
          $gateRoot = Join-Path $env:RUNNER_TEMP 'ai-daily-fixed-corpus'
          & $env:AI_DAILY_PROD_PYTHON scripts/corpus_gate.py `
            --work-dir (Join-Path $gateRoot 'corpus') `
            --out-root (Join-Path $gateRoot 'runs') `
            --evidence (Join-Path $gateRoot 'evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'fixed corpus gate failed' }
      - name: Run full Python test suite
        run: uv run pytest tests/ -v
      - name: Run Chinese path and cold-warm cache E2E
        run: >-
          uv run pytest tests/test_windows_rust_core_e2e.py -v
          -k "real_rust_chinese_path or real_rust_cold_warm_cache"
      - name: Prove clean deployment is idempotent and does not call an LLM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $stage = [IO.Path]::GetFullPath((Join-Path $tempRoot (
            'ai-daily-deploy-' + [guid]::NewGuid().ToString('N')
          )))
          $stagePrefix = $tempRoot + [IO.Path]::DirectorySeparatorChar
          if (-not $stage.StartsWith(
            $stagePrefix,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'deployment stage escaped RUNNER_TEMP'
          }
          git clone --quiet --no-hardlinks . $stage
          try {
            New-Item -ItemType Directory `
              -Path (Join-Path $stage '.ci-work') -Force | Out-Null
            $settings = Join-Path $stage 'config/settings.windows.yaml'
            Copy-Item -LiteralPath (
              Join-Path $stage 'config/settings.example.yaml'
            ) -Destination $settings
            $before = (Get-FileHash -LiteralPath $settings -Algorithm SHA256).Hash
            $env:DAILY_REPORT_PATHS__WORK_DIR = Join-Path $stage '.ci-work'
            $env:DEEPSEEK_API_KEY = 'ci-doctor-placeholder'
            $env:AI_DAILY_TEST_FORBID_LLM = '1'

            & pwsh -NoProfile -File (Join-Path $stage 'scripts/deploy_windows.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'first deployment failed' }
            $afterFirst = (
              Get-FileHash -LiteralPath $settings -Algorithm SHA256
            ).Hash
            $venvMarker = Join-Path $stage '.venv/pyvenv.cfg'
            $venvHash = (
              Get-FileHash -LiteralPath $venvMarker -Algorithm SHA256
            ).Hash
            $venvSentinel = Join-Path (
              Join-Path $stage '.venv'
            ) 'task11-preserve.sentinel'
            [IO.File]::WriteAllText(
              $venvSentinel,
              'preserve-existing-venv',
              [Text.UTF8Encoding]::new($false)
            )
            $sentinelHash = (
              Get-FileHash -LiteralPath $venvSentinel -Algorithm SHA256
            ).Hash

            & pwsh -NoProfile -File (Join-Path $stage 'scripts/deploy_windows.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'second deployment failed' }
            $afterSecond = (
              Get-FileHash -LiteralPath $settings -Algorithm SHA256
            ).Hash
            $venvHashAfter = (
              Get-FileHash -LiteralPath $venvMarker -Algorithm SHA256
            ).Hash
            if (-not (Test-Path -LiteralPath $venvSentinel -PathType Leaf)) {
              throw 'second deployment recreated the virtual environment'
            }
            $sentinelHashAfter = (
              Get-FileHash -LiteralPath $venvSentinel -Algorithm SHA256
            ).Hash
            if ($before -ne $afterFirst -or $before -ne $afterSecond) {
              throw 'deployment changed the non-secret local configuration'
            }
            if (
              $venvHash -ne $venvHashAfter -or
              $sentinelHash -ne $sentinelHashAfter
            ) {
              throw 'second deployment recreated the virtual environment'
            }
          }
          finally {
            if (Test-Path -LiteralPath $stage) {
              $resolvedStage = [IO.Path]::GetFullPath($stage)
              if (-not $resolvedStage.StartsWith(
                $stagePrefix,
                [StringComparison]::OrdinalIgnoreCase
              )) {
                throw 'refusing to remove deployment stage outside RUNNER_TEMP'
              }
              Remove-Item -LiteralPath $stage -Recurse -Force
            }
          }

  linux-compatibility:
    name: Linux compatibility / Python 3.10
    runs-on: ubuntu-latest
    env:
      DAILY_REPORT_PATHS__WORK_DIR: ${{ github.workspace }}/.ci-work
      DEEPSEEK_API_KEY: ci-doctor-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Sync locked compatibility dependencies
        run: uv sync --frozen
      - name: Verify production requirements projection
        run: uv run pytest tests/test_requirements_lock.py -v
      - name: Run Linux compatibility tests
        run: |
          mkdir -p .ci-work
          uv run pytest tests/ -v
