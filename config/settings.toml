[app]
name = "审计日报生成器"
version = "5.0.0"

[paths]
work_dir = "D:\\bochu_work"
data_dir = "data"
reports_dir = "data/reports"
db_dir = "data/db"

[llm]
provider = "deepseek"
model_id = "deepseek-chat"
temperature = 0.2
max_tokens = 8192  # 增加到 8192，确保有足够空间生成完整日报
max_retries = 3

[scanner]
allowed_extensions = [".xlsx", ".xls", ".pptx", ".pdf", ".txt", ".md", ".docx", ".csv", ".json", ".log"]
ignored_patterns = ["~$*", "*.tmp"]
excluded_dirs = ["D:\\bochu_work\\ai_daily_report\\data\\benchmarks"]
max_workers = 4
excel_max_rows = 50
pdf_max_pages = 5
text_max_chars = 6000
summary_excel_max_rows = 10
summary_pdf_max_pages = 2
summary_text_max_chars = 2000
total_max_chars = 50000
max_file_size_mb = 50
file_timeout_seconds = 30
file_timeout_by_extension = { ".pdf" = 45, ".xlsx" = 60, ".xls" = 60 }
index_db_path = "data/db/scan_index.sqlite3"
parser_profile_version = "v1"
worker_lane_mode = "direct"
