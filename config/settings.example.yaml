app:
  name: "审计日报生成器"
  version: "5.0.0"

paths:
  # Source checkout: copy this file locally and use an absolute work directory.
  # Installed mode keeps config/data/reports/db/logs below <install-root>/shared
  # through the launcher-owned DAILY_REPORT_* absolute path contract.
  # Windows example: D:/audit-work (escape backslashes inside quoted YAML).
  work_dir: "D:/audit-work"
  data_dir: "data"
  reports_dir: "data/reports"
  db_dir: "data/db"

llm:
  provider: "deepseek"
  model_id: "deepseek-chat"
  temperature: 0.2
  # 保留足够 token 预算，避免日报生成被截断。
  max_tokens: 8192
  max_retries: 3

scanner:
  index_db_path: "data/db/scan_index_v3.sqlite3"
  office_worker_path: "rust/target/release/ai-daily-office-parser"
  allowed_extensions:
    - ".xlsx"
    - ".xls"
    - ".pptx"
    - ".pdf"
    - ".txt"
    - ".md"
    - ".docx"
    - ".csv"
    - ".json"
    - ".log"
  ignored_patterns:
    - "~$*"
    - "*.tmp"
  excluded_dirs: []
  discovery_timeout_seconds: 30
  # Backend/routing/fallback order are compiled Rust policy.
  fallback_after_timeout: false
  # Keep legacy .doc/.ppt out of default scanning until explicitly enabled.
  legacy_office_enabled: false
  max_workers: 4
  excel_max_rows: 50
  pdf_max_pages: 5
  text_max_chars: 6000
  summary_excel_max_rows: 10
  summary_pdf_max_pages: 2
  summary_text_max_chars: 2000
  total_max_chars: 50000
  max_file_size_mb: 50
  file_timeout_seconds: 30
  file_timeout_by_extension:
    ".pdf": 45
    ".xlsx": 60
    ".xls": 60
  worker_max_requests: 128
  worker_idle_ttl_ms: 30000
  worker_rss_limit_bytes: 536870912
