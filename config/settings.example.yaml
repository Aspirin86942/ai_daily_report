app:
  name: "审计日报生成器"
  version: "5.0.0"

paths:
  # 复制成本机配置后，按运行系统改成真实工作目录。
  # Linux 示例: /home/george/bochu_work
  # Windows 示例: D:/bochu_work（双引号 YAML 中不要使用未转义的反斜杠）
  work_dir: "/path/to/work"
  data_dir: "data"
  reports_dir: "data/reports"
  db_dir: "data/db"

llm:
  provider: "deepseek"
  model_id: "deepseek-chat"
  temperature: 0.2
  # 保留足够 token 预算，避免日报生成被截断。
  max_tokens: 8192
  max_retries: 3

scanner:
  engine: "rust_v2"
  rust_scanner_bin: "rust/target/release/ai-daily-scanner"
  rust_index_db_path: "data/db/scan_index_v2.sqlite3"
  allowed_extensions:
    - ".xlsx"
    - ".xls"
    - ".pptx"
    - ".pdf"
    - ".txt"
    - ".md"
    - ".docx"
    - ".csv"
    - ".json"
    - ".log"
  ignored_patterns:
    - "~$*"
    - "*.tmp"
  excluded_dirs: []
  discovery_timeout_seconds: 30
  # Rust core owns parser routing; these values participate in cache identity.
  office_parser_backend: "rust_office_oxide_v1"
  rust_office_parser_bin: "rust/target/release/ai-daily-office-parser"
  office_parser_fallback_enabled: true
  office_parser_fallback_order:
    - "python_office_v1"
    - "python_sharepoint_text_v1"
  office_fallback_after_timeout: false
  office_fallback_policy_version: "hybrid_v1"
  # Keep legacy .doc/.ppt out of default scanning until explicitly enabled.
  office_legacy_extensions_enabled: false
  max_workers: 4
  excel_max_rows: 50
  pdf_max_pages: 5
  text_max_chars: 6000
  summary_excel_max_rows: 10
  summary_pdf_max_pages: 2
  summary_text_max_chars: 2000
  total_max_chars: 50000
  max_file_size_mb: 50
  file_timeout_seconds: 30
  file_timeout_by_extension:
    ".pdf": 45
    ".xlsx": 60
    ".xls": 60
  parser_profile_version: "v1"
