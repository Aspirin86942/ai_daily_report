app:
  name: "审计日报生成器"
  version: "rust-0.1.0"

paths:
  # 使用绝对工作路径。正式安装时将配置和以下输出目录放在程序包之外。
  # 相对路径以 EXE 所在目录为基准。
  work_dir: "D:/audit-work"
  data_dir: "data"
  reports_dir: "data/reports"
  db_dir: "data/db"
  log_dir: "logs"

llm:
  provider: "deepseek"
  model_id: "deepseek-chat"
  # API base URL；缺省时 DeepSeek 使用 https://api.deepseek.com。
  base_url: "https://api.deepseek.com"
  temperature: 0.2
  # 成稿、周报和月报的输出上限。
  max_tokens: 8192
  # 事实提取单独设置输出容量，实际值不超过已验证的模型输出上限。
  facts_max_tokens: 16384
  max_retries: 3
  # 单次请求超时；应用统一控制尝试次数。
  request_timeout_seconds: 120
  response_format: "json_object"
  # 思考模式参数默认不发送；经当前路由联调后可显式设置 enabled/disabled。
  thinking_mode: null
  # 直连使用 top_level；需要嵌套参数的网关使用 extra_body。
  # 有效值须与已设置的 thinking_mode 配合；未指定时保持原顶层发送格式。
  thinking_parameter_location: null
  max_request_utf8_bytes: 160000
  max_sources_per_batch: 8
  # 完整摘录的初始分批上限；容量不足时明确停止，不丢弃剩余内容。
  max_batches: 32
  # 公司网关的模型能力经联调确认后填写；空值禁止发送业务正文。
  context_window_tokens: null
  verified_max_output_tokens: null

report:
  scope_id: "personal_work"
  root_alias: "work"
  timezone: "Asia/Shanghai"
  default_target: "previous_calendar_day"
  notes_dir: "data/report_notes"

recovery:
  enforce_model_budgets: false
  missed_days_policy: "latest_due_day_with_gap_notice"
  max_calls_per_run: 12
  max_calls_per_calendar_day: 30
  run_budget_seconds: 900
  lock_wait_seconds: 5

retention:
  input_snapshot_days: 14
  terminal_run_days: 30
  snapshot_max_mib: 8

schedule:
  task_name: "AI Daily Report"
  local_time: "09:00"
  logon_catchup: true
  wake_to_run: false
  allow_on_battery: true
  stop_on_battery: false
  restart_count: 2
  restart_interval_minutes: 15
  execution_limit_minutes: 20

scanner:
  # 整节替换旧 scanner 配置，避免文件类型及排除列表被追加合并。
  dynaconf_merge: false
  index_db_path: "data/db/scan_index_rust_v3.sqlite3"
  allowed_extensions:
    - ".xlsx"
    - ".xls"
    - ".pptx"
    - ".pdf"
    - ".txt"
    - ".md"
    - ".docx"
    - ".csv"
  ignored_patterns:
    - "~$*"
    - "*.tmp"
    - ".env*"
    - "*.key"
    - "*.pem"
  # 单一目录名排除所有层级的同名目录；路径按扫描根目录解释。
  excluded_dirs: [".git", ".venv", ".uv", "node_modules", "target", "__pycache__"]
  follow_symlinks: false
  cloud_files_policy: "local_only"
  discovery_timeout_seconds: 30
  # 每种真实格式固定一个 Rust 解析器。
  # Keep legacy .doc/.ppt out of default scanning until explicitly enabled.
  legacy_office_enabled: false
  max_workers: 4
  excel_max_rows: 50
  pdf_max_pages: 5
  text_max_chars: 6000
  csv_encodings: [utf-8, utf-8-sig, gb18030]
  summary_excel_max_rows: 10
  summary_pdf_max_pages: 2
  summary_text_max_chars: 2000
  total_max_chars: 50000
  max_file_size_mb: 50
  file_timeout_seconds: 30
  file_timeout_by_extension:
    ".pdf": 45
    ".xlsx": 60
    ".xls": 60
  worker_max_requests: 128
  worker_idle_ttl_ms: 30000
  worker_rss_limit_bytes: 536870912
