[workspace]
members = [
    "discovery",
    "office_parser",
    "scanner_native",
    "scanner_contract",
    "scanner_core",
    "worker_contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
office_oxide = "0.1"
quick-xml = "0.40"
rayon = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
walkdir = "2"
zip = { version = "8.1", features = ["deflate"], default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
