[workspace]
members = [
    "build_identity",
    "discovery",
    "office_parser",
    "scanner_contract",
    "scanner_core",
    "text_parser",
    "worker_contract",
    "report_app",
    "pdf_parser",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "=0.4.44", features = ["serde"] }
glob = "=0.3.3"
office_oxide = "=0.1.2"
quick-xml = "=0.40.1"
rayon = "=1.12.0"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["arbitrary_precision"] }
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
walkdir = "=2.5.0"
zip = { version = "=8.6.0", features = ["deflate"], default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
minijinja = { version = "=3.0.0", features = ["serde"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
calamine = { version = "=0.36.1", default-features = false, features = ["dates"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
