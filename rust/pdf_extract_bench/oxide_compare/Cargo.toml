[package]
name = "pdf-oxide-comparison"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone benchmark. Neither the production nor the historical benchmark lockfile is shared.
[workspace]

[dependencies]
pdf_oxide = { version = "=0.3.78", default-features = false, features = ["legacy-crypto"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
