[package]
name = "ai-daily-scanner-core"
version.workspace = true
edition.workspace = true

[dependencies]
ai-daily-discovery = { path = "../discovery" }
ai-daily-scanner-contract = { path = "../scanner_contract" }
ai-daily-worker-contract = { path = "../worker_contract" }
ai-daily-text-parser = { path = "../text_parser" }
chrono.workspace = true
rayon.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[build-dependencies]
ai-daily-build-identity = { path = "../build_identity" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
