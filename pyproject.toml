[project]
name = "ai-daily-report"
version = "5.0.0"
description = "审计报告生成器 v5.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0,<3",
    "dynaconf>=3.2.0,<4",
    "PyYAML>=6.0.0,<7",
    "rich>=13.0.0,<16",
    "pandas>=2.0.0,<3",
    "openpyxl>=3.1.0,<4",
    "python-pptx>=0.6.0,<2",
    "pdfplumber>=0.10.0,<1",
    "jinja2>=3.1.0,<4",
    "python-docx>=1.1.0,<2",
    "sharepoint-to-text>=1.1,<2",
    "openai>=1.0.0,<3",
    "pypdfium2>=5,<6",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-timeout>=2.3,<3",
    "pytest-xdist>=3.6,<4",
    "reportlab>=4.0,<5",
]

[tool.uv]
package = false
cache-dir = ".uv/cache"
link-mode = "hardlink"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = [".", "scripts"]
